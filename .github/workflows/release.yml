name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish
        required: true
        default: v0.4.1

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: go test ./...
      - run: npm run check
      - run: npm run dist:linux
      - name: Create checksum
        shell: bash
        run: |
          cd dist
          sha256sum Arion-*.tar.gz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arion-linux-x64
          if-no-files-found: error
          path: |
            dist/Arion-*.tar.gz
            dist/SHA256SUMS-linux.txt

  windows-portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: go test ./...
      - run: npm run check
      - run: npm run dist:windows-portable
      - name: Create checksum
        shell: bash
        run: |
          cd dist
          sha256sum Arion-Portable-*.exe > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arion-windows-x64
          if-no-files-found: error
          path: |
            dist/Arion-Portable-*.exe
            dist/SHA256SUMS-windows.txt

  publish:
    needs: [linux, windows-portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: arion-*-x64
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Arion ${RELEASE_TAG}"
