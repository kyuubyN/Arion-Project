name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: go test ./...
      - run: npm run check
      - run: npm run dist:linux
      - name: Create checksum
        shell: bash
        run: |
          cd dist
          sha256sum Arion-*.tar.gz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arion-linux-x64
          if-no-files-found: error
          path: |
            dist/Arion-*.tar.gz
            dist/SHA256SUMS-linux.txt

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: go test ./...
      - run: npm run check
      - run: npm run dist:windows
      - name: Create checksum
        shell: pwsh
        run: |
          Get-FileHash dist/Arion-Setup-*.exe, dist/Arion-Portable-*.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arion-windows-x64
          if-no-files-found: error
          path: |
            dist/Arion-Setup-*.exe
            dist/Arion-Portable-*.exe
            dist/SHA256SUMS-windows.txt

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: arion-*-x64
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Arion ${GITHUB_REF_NAME}"
